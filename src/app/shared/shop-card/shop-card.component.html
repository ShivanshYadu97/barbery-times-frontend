<!-- Shop Card -->
<button
  type="button"
  (click)="selectShop()"
  class="relative flex h-[130px] w-full items-center gap-4 rounded-xl border border-gray-100 bg-white p-3.5 text-left shadow-[0_2px_10px_rgba(0,0,0,0.15)] transition md:h-auto md:gap-4 md:rounded-2xl md:p-4"
  [ngClass]="{
    'border-indigo-600 bg-indigo-50 ring-1 ring-indigo-600':
      isSelected,

    'hover:border-indigo-200 hover:shadow-sm':
      !isSelected && shop.isOpen,

    'cursor-not-allowed bg-gray-50 opacity-70':
      !shop.isOpen
  }"
>

  <!-- Shop Image -->
  <div
    class="flex h-[100px] w-[100px] shrink-0 items-center justify-center overflow-hidden rounded-xl bg-gray-100 md:h-20 md:w-20 md:rounded-xl"
  >
    <span class="text-5xl md:text-4xl">
      💈
    </span>
  </div>


  <!-- Shop Details -->
  <div class="min-w-0 flex-1">

    <!-- Shop Name + Status -->
    <div class="flex items-center justify-between gap-2">

      <h3
        class="truncate text-lg font-bold leading-tight text-gray-900 md:text-base"
      >
        {{ shop.name }}
      </h3>

      <!-- Status -->
      <span
        class="shrink-0 rounded-full px-2.5 py-1 text-[9px] font-bold leading-none md:px-2.5 md:py-1 md:text-[10px]"
        [ngClass]="
          shop.isOpen
            ? 'bg-green-50 text-green-600'
            : 'bg-red-50 text-red-500'
        "
      >
        {{ shop.isOpen ? 'OPEN' : 'CLOSED' }}
      </span>

    </div>


    <!-- Rating -->
    <div class="mt-2 flex items-center gap-1.5 leading-none">

      <span class="text-base text-amber-400">
        ★
      </span>

      <span class="text-sm font-semibold text-gray-700">
        {{ shop.rating }}
      </span>

      <span class="text-sm text-gray-400">
        ({{ shop.reviewCount }})
      </span>

    </div>


    <!-- Distance -->
    <p
      class="mt-2.5 text-sm font-medium leading-none text-gray-500"
    >
      📍 {{ shop.distance }} away
    </p>

  </div>


  <!-- Arrow / Selected -->
  <div class="shrink-0">

    <!-- Selected -->
    <span
      *ngIf="isSelected"
      class="flex h-7 w-7 items-center justify-center rounded-full bg-indigo-600 text-xs font-bold text-white"
    >
      ✓
    </span>

    <!-- Arrow -->
    <span
      *ngIf="!isSelected"
      class="text-xl font-medium leading-none text-gray-400"
    >
      ›
    </span>

  </div>

</button>
