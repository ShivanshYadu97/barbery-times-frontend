<!-- Action Card -->
<button
  *ngIf="isActionCard"
  type="button"
  (click)="handleAction()"
  class="flex h-[105px] w-full flex-col items-center justify-center rounded-xl border border-gray-200 bg-white px-2 py-3 transition hover:bg-gray-50 md:h-[130px] md:rounded-2xl md:p-5"
>
  <!-- Icon -->
  <span class="text-2xl leading-none md:text-3xl">
    {{ icon }}
  </span>

  <!-- Title -->
  <span
    class="mt-2 text-center text-[10px] font-medium leading-tight text-gray-700 md:text-base"
  >
    {{ title }}
  </span>

  <!-- Description -->
  <span
    *ngIf="description"
    class="mt-1 text-center text-[8px] font-medium leading-4 text-gray-500 md:mt-2 md:text-xs md:leading-5"
  >
    {{ description }}
  </span>
</button>


<!-- Stat Card -->
<div
  *ngIf="!isActionCard"
  class="h-full rounded-xl border border-gray-200 bg-white p-3 shadow-sm md:rounded-2xl md:p-5"
>
  <div class="flex h-full items-center gap-3 md:gap-4">

    <!-- Icon -->
    <div
      class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-indigo-50 text-lg md:h-14 md:w-14 md:rounded-2xl md:text-2xl"
    >
      {{ icon }}
    </div>

    <!-- Content -->
    <div class="min-w-0">

      <p class="text-xs font-medium text-gray-500 md:text-sm">
        {{ title }}
      </p>

      <p
        *ngIf="value !== ''"
        class="mt-1 text-2xl font-bold text-gray-900 md:text-3xl"
      >
        {{ value }}
      </p>

      <button
        *ngIf="actionText"
        class="mt-1 block text-xs font-semibold text-indigo-600 md:mt-2 md:text-sm"
      >
        {{ actionText }}
      </button>

      <p
        *ngIf="subtitle"
        class="mt-1 text-[10px] font-medium text-gray-500 md:mt-2 md:text-sm"
      >
        {{ subtitle }}
      </p>

    </div>

  </div>
</div>
