<div
  class="flex h-full min-h-[125px] flex-col justify-center rounded-xl bg-gradient-to-br from-indigo-700 via-indigo-800 to-indigo-950 p-3 text-white shadow-md md:min-h-[260px] md:rounded-2xl md:p-5"
>
  
  <!-- Queue Position Card -->
  <ng-container *ngIf="type === 'queue'">

    <div class="flex flex-1 flex-col items-center justify-center">

      <!-- Icon -->
      <div
        class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-white/90 text-xl text-indigo-700 md:h-20 md:w-20 md:text-4xl"
      >
        {{ icon }}
      </div>

      <!-- Value -->
      <p class="mt-2 text-2xl font-bold leading-none md:mt-3 md:text-5xl">
        {{ value }}
      </p>

      <!-- Label -->
      <p
        class="mt-2 text-center text-[9px] font-medium leading-3 text-indigo-100 md:mt-3 md:text-base md:leading-normal"
      >
        {{ label }}
      </p>

    </div>

  </ng-container>


  <!-- Waiting Time Card -->
  <ng-container *ngIf="type === 'time'">

    <div class="flex flex-1 flex-col items-center justify-center">

      <!-- Label -->
      <p class="text-center text-[9px] font-medium leading-3 text-indigo-100 md:text-sm">
        {{ label }}
      </p>

      <!-- Icon + Time -->
      <div class="mt-2 flex min-w-0 items-center justify-center gap-1.5 md:mt-3 md:gap-3">

        <!-- Icon -->
        <div
          class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-white/90 text-lg text-indigo-700 md:h-16 md:w-16 md:text-3xl"
        >
          {{ icon }}
        </div>

        <!-- Time -->
        <p
          class="min-w-0 whitespace-nowrap text-lg font-bold leading-none tracking-tight md:text-4xl md:tracking-wide"
        >
          {{ value }}
        </p>

      </div>

      <!-- Format -->
      <p
        class="mt-3 text-center text-[7px] font-medium tracking-wider text-indigo-200 md:text-xs md:tracking-widest"
      >
        HH&nbsp;&nbsp;:&nbsp;&nbsp;MM&nbsp;&nbsp;:&nbsp;&nbsp;SS
      </p>

    </div>

  </ng-container>

</div>
