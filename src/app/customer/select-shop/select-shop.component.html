<!-- Select Shop -->
<section class="mx-auto w-full max-w-3xl px-4 md:px-0">

    <!-- Page Header -->
    <div class="mb-5 px-1 pt-4 pb-2 md:mb-6 md:px-0 md:py-2">

        <!-- Back + Centered Title -->
        <div class="relative flex h-10 items-center justify-center">

            <!-- Back Arrow -->
            <button type="button" aria-label="Go back" (click)="goBack()"
                class="absolute left-0 top-1/2 flex h-10 w-10 -translate-y-1/2 items-center justify-center">
                <span class="block -translate-y-1 text-5xl leading-none text-gray-700">
                    ‹
                </span>
            </button>

            <!-- Page Title -->
            <h1 class="text-sm font-bold leading-none text-gray-900 md:text-2xl">
                Book Slot
            </h1>

        </div>

    </div>


    <!-- Search -->
    <div class="relative mb-4 md:mb-6">

        <input type="text" placeholder="Search shop near you..."
            class="h-14 w-full rounded-xl border border-gray-200 bg-gray-100 pl-10 pr-12 text-xs text-gray-700 shadow-[0_2px_8px_rgba(0,0,0,0.08)] outline-none transition placeholder:text-gray-500 focus:border-indigo-400 focus:bg-gray-100 focus:shadow-[0_3px_10px_rgba(0,0,0,0.10)] focus:ring-2 focus:ring-indigo-100 md:h-12 md:rounded-2xl md:text-base" />

        <!-- Search Icon -->
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-xs text-gray-400 md:left-4 md:text-base">
            🔍
        </span>

        <!-- Location -->
        <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-indigo-600 md:right-4 md:text-base">
            📍
        </span>

    </div>


    <!-- Nearby Shops -->
    <section class="mt-6">

        <!-- Heading -->
        <div class="mb-6 flex items-center justify-between md:mb-4">

            <h2 class="text-sm font-bold text-gray-900 md:text-lg">
                Nearby Shops
            </h2>

            <span class="text-[9px] font-medium text-gray-400 md:text-sm">
                {{ (shops$ | async)?.length || 0 }} shops
            </span>

        </div>


        <!-- Shop List -->
        <div>

            <app-shop-card
                *ngFor="let shop of (shops$ | async)"
                class="mb-4 block last:mb-0"
                [shop]="shop"
                [isSelected]="selectedShop?.id === shop.id"
                (shopSelected)="selectShop($event)">
            </app-shop-card>

        </div>

    </section>


    <!-- Info Message -->
    <div class="mt-3 md:mt-6">

        <app-message-card message="Shop open status indicates if you can join the queue now.">
        </app-message-card>

    </div>

</section>
