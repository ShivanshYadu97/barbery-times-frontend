<div class="space-y-6">

  <!-- Welcome / Page Intro -->
  <section>
    <h1 class="text-2xl font-bold text-gray-900">
      Welcome back, Rohit! 👋
    </h1>

    <p class="mt-1 text-gray-500">
      Here's what's happening with your shop today.
    </p>
  </section>

  <!-- Shop Status Toggle -->
  <section class="mb-4 md:mb-5">

    <!-- Label -->
    <p class="mb-1.5 text-[9px] font-bold uppercase tracking-wide text-gray-500 md:mb-2 md:text-xs">
      Shop Status
    </p>

    <!-- Toggle -->
    <button type="button" (click)="toggleShopStatus()" [attr.aria-pressed]="isShopOpen"
      [attr.aria-label]="isShopOpen ? 'Close Shop' : 'Open Shop'"
      class="relative h-8 w-24 overflow-hidden rounded-full p-1 shadow-sm transition-colors duration-300 ease-in-out md:h-10 md:w-28"
      [ngClass]="
      isShopOpen
        ? 'bg-gradient-to-r from-green-500 to-green-400'
        : 'bg-gradient-to-r from-red-600 to-red-500'
    ">

      <!-- Toggle Knob -->
      <span
        class="absolute left-1 top-1/2 h-6 w-6 -translate-y-1/2 rounded-full bg-gray-100 shadow-md transition-transform duration-300 ease-in-out md:h-8 md:w-8"
        [ngClass]="
        isShopOpen
          ? 'translate-x-16 md:translate-x-[4.5rem]'
          : 'translate-x-0'
      "></span>

      <!-- Status Text -->
      <span
        class="absolute inset-0 flex items-center whitespace-nowrap text-[7px] font-bold text-white transition-all duration-300 ease-in-out md:text-[9px]"
        [ngClass]="
        isShopOpen
          ? 'justify-start pl-3 md:pl-4'
          : 'justify-end pr-3 md:pr-4'
      ">
        {{ isShopOpen ? 'SHOP OPEN' : 'SHOP CLOSE' }}
      </span>

    </button>

  </section>

  <!-- Dashboard Stats -->
  <section class="grid grid-cols-2 gap-3 md:gap-5">

    <!-- Current Walk-In Queue -->
    <app-dashboard-card icon="👥" title="Current Walk-In Queue" value="8" actionText="View Queue →">
    </app-dashboard-card>

    <!-- Current Online Queue -->
    <app-dashboard-card icon="📱" title="Current Online Queue" value="5" actionText="View Queue →">
    </app-dashboard-card>

    <!-- Today's Appointments -->
    <app-dashboard-card icon="📅" title="Today's Appointments" value="24" actionText="View Appointments →">
    </app-dashboard-card>

    <!-- Today's Revenue -->
    <app-dashboard-card icon="₹" title="Today's Revenue" value="₹18,750" subtitle="↑ 12.5% vs yesterday"
      actionText="View Revenue →">
    </app-dashboard-card>

    <!-- Average Rating -->
    <app-dashboard-card icon="☆" title="Avg. Rating" value="4.8" subtitle="★★★★★ From 186 reviews">
    </app-dashboard-card>

  </section>

  <!-- Barbers Status -->
  <section class="rounded-2xl border border-gray-200 bg-white shadow-sm">

    <!-- Section Header -->
    <div class="flex items-center justify-between border-b border-gray-200 px-6 py-5">
      <h2 class="text-xl font-bold text-gray-900">
        Barbers Status
      </h2>

      <button class="font-semibold text-indigo-600 hover:text-indigo-700">
        View All →
      </button>
    </div>

    <!-- Table -->
    <app-dashboard-table [columns]="barberColumns" [data]="(barbers$ | async) || []">
    </app-dashboard-table>
    
  </section>

  <!-- Quick Actions -->
  <section class="rounded-2xl border border-gray-200 bg-white p-4 shadow-sm md:p-6">

    <h2 class="mb-4 text-lg font-bold text-gray-900 md:mb-5 md:text-xl">
      Quick Actions
    </h2>

    <div class="grid grid-cols-4 gap-2.5 md:grid-cols-4 md:gap-4">

      <!-- Add Services -->
      <app-dashboard-card [isActionCard]="true" icon="☷+" title="Add Services">
      </app-dashboard-card>

      <!-- Today's Appointments -->
      <app-dashboard-card [isActionCard]="true" icon="📅" title="Today's Appointments">
      </app-dashboard-card>

      <!-- Add Barber -->
      <app-dashboard-card [isActionCard]="true" icon="✂️" title="Add Barber">
      </app-dashboard-card>

      <!-- Revenue -->
      <app-dashboard-card [isActionCard]="true" icon="₹+" title="Revenue+">
      </app-dashboard-card>

      <!-- Manage Services -->
      <app-dashboard-card [isActionCard]="true" icon="✂️" title="Manage Services">
      </app-dashboard-card>

      <!-- Manage Barbers -->
      <app-dashboard-card [isActionCard]="true" icon="💈" title="Manage Barbers">
      </app-dashboard-card>

      <!-- Send Notification -->
      <app-dashboard-card [isActionCard]="true" icon="🔔" title="Send Notification">
      </app-dashboard-card>

      <!-- View Reports -->
      <app-dashboard-card [isActionCard]="true" icon="📊" title="View Reports">
      </app-dashboard-card>

    </div>

  </section>

</div>
